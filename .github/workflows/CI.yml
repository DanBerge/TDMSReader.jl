name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: write     # julia-actions/cache prunes old caches
  contents: read
  id-token: write    # Codecov upload via OIDC, no token secret

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.9', 'lts', '1']
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  # The tests against the oldest versions the compat entries allow, weak dependencies
  # included, on the oldest Julia: the matrix above tests only the newest.
  downgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.9'
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          mode: alldeps
          julia_version: '1.9'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
